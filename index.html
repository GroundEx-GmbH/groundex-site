<!--
  GroundEx GmbH — Website-Entwurf / Site Taslağı v2
  Dil seçenekli: DE (varsayılan) / TR / EN

  ================= TÜRKÇE NOTLAR =================
  1) WHATSAPP_NUMBER: script içinde en üstte, kendi numaranla değiştir.
  2) Yeni araç/malzeme eklemek: script içinde "const machines" dizisini bul.
     Yeni bir kayıt eklemek için mevcutlardan birini kopyala, sona yapıştır, bilgileri değiştir. Örnek:

     { name:"Örnek Makine Adı", category:"baumaschinen", type:"kauf", price:"10.000 €", specs:"Baujahr 2020 · 500 Bh", image:"" }

     category şu üç değerden biri olmalı: "baumaschinen" | "fahrzeuge" | "werkzeuge"
     type şu üç değerden biri olmalı:     "kauf" | "miete" | "kauf_miete"
     image alanına fotoğraf linki yazarsan foto görünür, boş "" bırakırsan ikon görünür.
     name, price, specs alanlarını istediğin dilde/serbest yazabilirsin — bunlar otomatik çevrilmez,
     sadece category ve type etiketleri (Satılık/Kiralık, İş Makineleri/Araçlar vb.) dile göre otomatik değişir.
  3) Metin çevirileri: script içinde "const i18n" bölümünde de/tr/en olarak var,
     istersen buradan da düzenleyebilirsin.
  4) Adres/e-posta/telefon: HTML içinde "Kontakt/İletişim/Contact" bölümündeki placeholder'lar.
  ==================================================
-->

<style>
  :root{
    --asphalt:#1c1f1e;
    --asphalt-2:#262b29;
    --steel:#3a4750;
    --concrete:#edeae3;
    --concrete-2:#e2ddd0;
    --orange:#e8590c;
    --orange-dark:#c2480a;
    --yellow:#f2b705;
    --line:#3d4340;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--concrete);
    color:var(--asphalt);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.01em;
    font-weight:600;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  .stripe{
    height:10px;
    background:repeating-linear-gradient(45deg,var(--yellow) 0 18px, var(--asphalt) 18px 36px);
    background-size:51px 51px;
    animation:stripe-move 2.4s linear infinite;
  }
  .stripe.thin{height:6px;}
  @keyframes stripe-move{
    0%{background-position:0 0;}
    100%{background-position:51px 0;}
  }
  @media (prefers-reduced-motion: reduce){
    .stripe{animation:none;}
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

  /* SCROLL REVEAL */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease;}
  .reveal.in-view{opacity:1;transform:translateY(0);}

  /* NAV */
  header{position:sticky;top:0;z-index:50;background:var(--asphalt);border-bottom:1px solid var(--line);}
  .navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1180px;margin:0 auto;gap:16px;}
  .logo{display:flex;align-items:center;gap:2px;font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:var(--concrete);letter-spacing:0.02em;flex-shrink:0;
    background:var(--concrete);padding:8px 14px;border-radius:6px;}
  .logo img{height:46px;width:auto;display:block;background:#fff;padding:3px 8px;border-radius:4px;}
  .tagline-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(242,183,5,0.12);border:1px solid rgba(242,183,5,0.4);color:var(--yellow);padding:8px 16px;border-radius:2px;font-size:13px;font-weight:600;letter-spacing:0.02em;margin-top:26px;}
  .tagline-badge svg{width:15px;height:15px;flex-shrink:0;}
  .logo span.box{background:var(--orange);color:var(--asphalt);padding:2px 8px;margin-left:2px;}
  nav.links{display:flex;gap:28px;}
  nav.links a{color:var(--concrete-2);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;transition:color .15s;}
  nav.links a:hover{color:var(--yellow);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  .lang-btn{background:transparent;border:none;color:var(--concrete-2);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:7px 10px;cursor:pointer;letter-spacing:0.04em;transition:.15s;}
  .lang-btn.active{background:var(--orange);color:#fff;}
  .lang-btn:not(.active):hover{color:var(--yellow);}
  .wa-btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;padding:10px 18px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.03em;border-radius:2px;transition:background .15s, transform .15s;border:none;cursor:pointer;white-space:nowrap;}
  .wa-btn:hover{background:var(--orange-dark);transform:translateY(-1px);}
  .menu-toggle{display:none;background:none;border:none;color:var(--concrete);font-size:24px;cursor:pointer;}

  /* FLOATING WHATSAPP BUTTON */
  .wa-float{
    position:fixed;bottom:24px;right:24px;z-index:100;
    display:flex;align-items:center;gap:10px;
    background:#25D366;color:#fff;
    padding:14px 20px;border-radius:50px;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    font-weight:700;font-size:14px;letter-spacing:0.02em;
    text-transform:uppercase;
    transition:transform .15s, box-shadow .15s;
  }
  .wa-float:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(0,0,0,0.4);}
  .wa-float svg{width:22px;height:22px;flex-shrink:0;}
  .wa-float .pulse{
    position:absolute;inset:0;border-radius:50px;
    box-shadow:0 0 0 0 rgba(37,211,102,0.55);
    animation:wa-pulse 2.2s infinite;
    pointer-events:none;
  }
  @keyframes wa-pulse{
    0%{box-shadow:0 0 0 0 rgba(37,211,102,0.55);}
    70%{box-shadow:0 0 0 16px rgba(37,211,102,0);}
    100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}
  }
  @media (max-width:560px){
    .wa-float{bottom:16px;right:16px;padding:13px 16px;}
    .wa-float span.wa-float-label{display:none;}
  }


  /* HERO */
  .hero{background:linear-gradient(180deg,var(--asphalt) 0%, var(--asphalt-2) 100%);color:var(--concrete);padding:90px 24px 70px;position:relative;overflow:hidden;}

  /* SİNEMATİK ARKA PLAN FOTOĞRAFI — yavaş Ken Burns zoom + sinema renk tonlaması */
  .hero-bg{
    position:absolute;inset:0;z-index:0;
    background-size:cover;background-position:center 35%;
    filter:grayscale(0.1) contrast(1.05) brightness(0.85) sepia(0.08) saturate(1.15);
    animation:ken-burns 26s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes ken-burns{
    from{transform:scale(1.0) translate(0,0);}
    to{transform:scale(1.12) translate(-1%,-1%);}
  }
  .hero-grade{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(180deg, rgba(10,12,13,0.35) 0%, rgba(10,12,13,0.12) 30%, rgba(10,12,13,0.5) 78%, rgba(10,12,13,0.88) 100%),
      linear-gradient(90deg, rgba(10,12,13,0.62) 0%, rgba(10,12,13,0.15) 50%, transparent 68%),
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.32) 100%);
  }
  /* FİLM GRAIN — hafif, titreşen tanecik dokusu */
  .hero-grain{
    position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0.5;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
    animation:grain-shift 0.6s steps(4) infinite;
  }
  @keyframes grain-shift{
    0%{transform:translate(0,0);}
    25%{transform:translate(-2%,1%);}
    50%{transform:translate(1%,-2%);}
    75%{transform:translate(-1%,-1%);}
    100%{transform:translate(0,0);}
  }
  /* LETTERBOX — sinema formatı üst/alt bantlar */
  .letterbox{position:absolute;left:0;right:0;background:#000;z-index:4;pointer-events:none;}
  .letterbox-top{top:0;height:5%;}
  .letterbox-bottom{bottom:0;height:5%;}
  @media (max-width:700px){.letterbox{height:3.2%;}}
  @media (prefers-reduced-motion: reduce){
    .hero-bg{animation:none;}
    .hero-grain{animation:none;}
  }
  .hero::before{content:"";position:absolute;right:-10%;top:-20%;width:600px;height:600px;background:radial-gradient(circle, rgba(232,89,12,0.16) 0%, transparent 70%);}
  .hero-inner{max-width:1180px;margin:0 auto;position:relative;}

  /* İŞ MAKİNESİ SİLÜETLERİ — ufukta sürekli kayan, sıcak ışıkla arkadan aydınlatılmış sahne */
  .skyline{position:absolute;left:0;right:0;bottom:190px;overflow:hidden;pointer-events:none;z-index:0;}
  .skyline-track{display:flex;width:200%;height:100%;will-change:transform;}
  .skyline-svg{width:50%;height:100%;flex-shrink:0;display:block;}
  .skyline-far{height:70px;opacity:0.3;filter:blur(0.5px);}
  .skyline-far .skyline-track{animation:skyline-scroll 55s linear infinite;}
  .skyline-near{height:95px;opacity:0.55;bottom:150px;}
  .skyline-near .skyline-track{animation:skyline-scroll 30s linear infinite reverse;}
  @keyframes skyline-scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .skyline-track{animation:none;}
  }
  @media (max-width:960px){
    .skyline{display:none;}
  }
  .light-sweep{
    position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  }
  .light-sweep::before{
    content:"";position:absolute;top:-30%;left:-40%;width:55%;height:160%;
    background:linear-gradient(78deg, transparent 0%, rgba(242,183,5,0.02) 30%, rgba(242,183,5,0.22) 50%, rgba(255,255,255,0.06) 52%, rgba(242,183,5,0.22) 54%, rgba(242,183,5,0.02) 70%, transparent 100%);
    transform:rotate(6deg);
    animation:sweep 6s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{left:-50%;}
    50%{left:85%;}
    100%{left:-50%;}
  }
  /* Yavaş "nefes alan" arka plan parlaması — sürekli, göze çarpan büyüyüp küçülme */
  .hero::before{
    animation:glow-pulse 5s ease-in-out infinite;
  }
  @keyframes glow-pulse{
    0%,100%{opacity:0.7;transform:scale(1);}
    50%{opacity:1;transform:scale(1.15);}
  }

  /* SİNEMATİK METİN GİRİŞİ — sayfa yüklenince kademeli beliren başlık/metin/butonlar */
  .cinema-in{
    opacity:0;transform:translateY(28px);
    animation:cinema-reveal 0.9s cubic-bezier(.16,.84,.44,1) forwards;
  }
  .cinema-in.d1{animation-delay:.05s;}
  .cinema-in.d2{animation-delay:.18s;}
  .cinema-in.d3{animation-delay:.34s;}
  .cinema-in.d4{animation-delay:.48s;}
  .cinema-in.d5{animation-delay:.62s;}
  @keyframes cinema-reveal{
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .cinema-in{animation:none;opacity:1;transform:none;}
    .light-sweep::before{animation:none;display:none;}
  }

  /* TOZ / DUMAN BULUTLARI */
  .dust-field{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .dust-mote{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, rgba(242,183,5,0.22) 0%, rgba(242,183,5,0.07) 45%, transparent 72%);
    filter:blur(2px);
    animation:dust-drift linear infinite;
    will-change:transform,opacity;
  }
  @keyframes dust-drift{
    0%{transform:translate(0,0) scale(0.8);opacity:0;}
    15%{opacity:0.6;}
    50%{transform:translate(var(--dx,40px),calc(var(--dy,-60px)*0.5)) scale(1.25);}
    85%{opacity:0.5;}
    100%{transform:translate(calc(var(--dx,40px)*2),var(--dy,-60px)) scale(1.5);opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .dust-mote{animation:none;display:none;}
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--yellow);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:18px;}
  .hero h1{font-size:clamp(36px,6vw,64px);line-height:1.04;max-width:820px;margin-bottom:22px;}
  .hero h1 em{color:var(--orange);font-style:normal;display:block;}
  .hero p.lead{font-size:18px;color:var(--concrete-2);max-width:560px;margin-bottom:34px;font-weight:400;}
  .hero-ctas{display:flex;gap:16px;flex-wrap:wrap;}
  .stats-strip{max-width:1180px;margin:56px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);position:relative;}
  .stat{padding:20px 8px 0;text-align:center;}
  .stat-num{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--yellow);}
  .stat-label{font-size:12px;color:var(--concrete-2);text-transform:uppercase;letter-spacing:0.04em;margin-top:4px;}
  @media (max-width:700px){.stats-strip{grid-template-columns:repeat(2,1fr);row-gap:20px;}}
  .btn-outline{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--concrete-2);color:var(--concrete);padding:12px 22px;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:0.03em;border-radius:2px;transition:border-color .15s, color .15s;}
  .btn-outline:hover{border-color:var(--yellow);color:var(--yellow);}

  /* SERVICES */
  .services{background:var(--concrete);padding:64px 24px;}
  .services-grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--asphalt);border:1px solid var(--asphalt);}
  .service-card{background:var(--concrete);padding:36px 28px;}
  .service-card .num{font-family:'IBM Plex Mono',monospace;color:var(--orange);font-size:13px;letter-spacing:0.06em;margin-bottom:14px;display:block;}
  .service-card h3{font-size:22px;margin-bottom:10px;}
  .service-card p{font-size:14.5px;color:#4a4a44;}

  /* SECTION HEADS */
  .section-head{max-width:1180px;margin:0 auto;padding:70px 24px 10px;}
  .section-head .eyebrow-dark{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--orange-dark);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;}
  .section-head h2{font-size:clamp(28px,4vw,40px);}
  .section-head p.note{color:#666;font-size:14.5px;margin-top:10px;max-width:560px;}

  /* FILTER TABS */
  .filters{max-width:1180px;margin:28px auto 0;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap;}
  .filter-btn{background:transparent;border:1.5px solid var(--asphalt);color:var(--asphalt);padding:8px 16px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;border-radius:2px;transition:.15s;}
  .filter-btn.active, .filter-btn:hover{background:var(--asphalt);color:var(--concrete);}

  /* MACHINE GRID */
  .machine-grid{max-width:1180px;margin:0 auto;padding:34px 24px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .card{background:#fff;border:1px solid #ddd6c6;display:flex;flex-direction:column;transition:transform .18s, box-shadow .18s;}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(28,31,30,0.12);}
  .card-media{aspect-ratio:4/3;background:var(--steel);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
  .card:hover .card-media img{transform:scale(1.08);}
  .card-media .icon{width:64px;height:64px;stroke:var(--concrete-2);opacity:0.85;}
  .badge{position:absolute;top:10px;left:10px;background:var(--yellow);color:var(--asphalt);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:4px 9px;letter-spacing:0.04em;text-transform:uppercase;}
  .badge.example{background:var(--asphalt);color:var(--yellow);left:auto;right:10px;top:10px;}
  .card-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-body h3{font-size:18px;letter-spacing:0.005em;}
  .card-body .specs{font-size:12.5px;color:#666;line-height:1.6;}
  .card-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid #eee5d3;}
  .price{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--asphalt);}
  .price small{font-size:11px;color:#888;font-weight:500;}
  .detail-btn{font-size:12.5px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:0.03em;display:flex;align-items:center;gap:5px;}
  .detail-btn:hover{color:var(--orange-dark);}

  /* PROCESS */
  .process{background:var(--concrete-2);padding:70px 24px;}
  .process-grid{max-width:1180px;margin:34px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
  .process-step{position:relative;padding-left:6px;}
  .process-step .step-num{font-family:'Oswald',sans-serif;font-size:44px;font-weight:700;color:var(--orange);opacity:0.9;line-height:1;margin-bottom:12px;}
  .process-step h4{font-size:17px;text-transform:uppercase;margin-bottom:8px;letter-spacing:0.02em;}
  .process-step p{font-size:14px;color:#555;}

  /* WHY US */
  .why{background:var(--asphalt);color:var(--concrete);padding:70px 24px;}
  .why-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;}
  .why h2{font-size:clamp(26px,4vw,36px);margin-bottom:18px;}
  .why p.lead-p{color:var(--concrete-2);font-size:15px;margin-bottom:22px;max-width:460px;}
  .why-list{display:flex;flex-direction:column;gap:0;}
  .why-item{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);}
  .why-item:first-child{padding-top:0;}
  .why-item .mark{color:var(--orange);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .why-item h4{font-size:16px;margin-bottom:4px;text-transform:none;font-family:'Inter',sans-serif;font-weight:700;}
  .why-item p{font-size:13.5px;color:#a9a49a;margin:0;max-width:100%;}

  /* FAQ */
  .faq{background:var(--concrete);padding:70px 24px;}

  let currentLang = "de";
  const icon = `<svg class="icon" viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="24" width="18" height="12" rx="1"></rect>
      <path d="M22 24h10l8 8v4H22z"></path>
      <circle cx="12" cy="38" r="4"></circle>
      <circle cx="34" cy="38" r="4"></circle>
    </svg>`;

  function waLink(message){ return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`; }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function applyStaticText(){
    const t = i18n[currentLang];
    document.querySelectorAll("[data-i18n]").forEach(el=>{
      const key = el.getAttribute("data-i18n");
      if(t[key] !== undefined) el.textContent = t[key];
    });
    document.getElementById("wa-nav").href = waLink(t.wa_default);
    document.getElementById("wa-hero").href = waLink(t.wa_default);
    document.getElementById("wa-contact").href = waLink(t.wa_default);
    const mapsLink = document.getElementById("maps-link");
    if(mapsLink) mapsLink.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(COMPANY_ADDRESS);
    document.getElementById("wa-float").href = waLink(t.wa_default);
    document.documentElement.lang = currentLang;
    const mt = document.querySelector(".menu-toggle"); if(mt) mt.setAttribute("aria-label", t.menu_label);
    document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active", b.dataset.lang===currentLang));
  }

  const categories = ["all","baumaschinen","fahrzeuge","werkzeuge","pflege"];
  let activeCategory = "all";
  const grid = document.getElementById("machine-grid");
  const filterBar = document.getElementById("filters");

  function renderFilters(){
    const t = i18n[currentLang];
    filterBar.innerHTML = "";
    const labels = {all:t.cat_all, baumaschinen:t.cat_baumaschinen, fahrzeuge:t.cat_fahrzeuge, werkzeuge:t.cat_werkzeuge, pflege:t.cat_pflege};
    categories.forEach(cat=>{
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (cat===activeCategory ? " active" : "");
      btn.textContent = labels[cat];
      btn.onclick = ()=>{ activeCategory = cat; renderFilters(); renderCards(); };
      filterBar.appendChild(btn);
    });
  }

  function renderCards(){
    const t = i18n[currentLang];
    const typeLabels = {kauf:t.type_kauf, miete:t.type_miete, kauf_miete:t.type_kauf_miete};
    const catLabels = {baumaschinen:t.cat_baumaschinen, fahrzeuge:t.cat_fahrzeuge, werkzeuge:t.cat_werkzeuge, pflege:t.cat_pflege};
    grid.innerHTML = "";
    machines
      .filter(m => activeCategory==="all" || m.category===activeCategory)
      .forEach(m=>{
        const card = document.createElement("div");
        card.className = "card reveal";
        card.innerHTML = `
          <div class="card-media">
            ${m.image ? `<img src="${m.image}" alt="${escapeHtml(m.name)}" loading="lazy" decoding="async">` : icon}
            ${(m.images && m.images.length>1) ? `<span class="photo-count">📷 ${m.images.length}</span>` : ""}
            <span class="badge">${typeLabels[m.type]}</span>
            ${m.used ? `<span class="badge example">${t.badge_used}</span>` : ""}
          </div>
          <div class="card-body">
            <h3>${escapeHtml(m.name)}</h3>
            <div class="specs mono">${escapeHtml(m.specs)}</div>
            ${(m.details || (m.images && m.images.length>1)) ? `<button type="button" class="more-btn">${MORE_LABEL[currentLang] || MORE_LABEL.de}</button>` : ""}
          </div>
          <div class="card-footer">
            <div class="price">${escapeHtml(m.price)}<br><small>${catLabels[m.category]}</small></div>
            <a class="detail-btn" href="${waLink(t.wa_inquiry(m.name))}" target="_blank" rel="noopener noreferrer">${t.detail_btn}</a>
          </div>
        `;
        const mb = card.querySelector(".more-btn");
        if(mb) mb.onclick = ()=> openProduct(m);
        grid.appendChild(card);
      });
    observeReveals();
  }

  /* ===== Ürün detay penceresi ===== */
  const MORE_LABEL = {de:"Mehr Details", tr:"Detaylar", en:"More details"};
  const pm = document.createElement("div");
  pm.className = "pm";
  pm.innerHTML = '<div class="pm-box"><button class="pm-close" aria-label="Schließen">×</button><div class="pm-gallery"><img class="pm-main" alt=""><div class="pm-thumbs"></div></div><div class="pm-info"></div></div>';
  document.body.appendChild(pm);
  function closeProduct(){ pm.classList.remove("open"); document.body.style.overflow = ""; }
  pm.addEventListener("click", e=>{ if(e.target === pm || e.target.closest(".pm-close")) closeProduct(); });
  document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeProduct(); });
  function openProduct(m){
    const t = i18n[currentLang];
    const imgs = (m.images && m.images.length) ? m.images : (m.image ? [m.image] : []);
    const main = pm.querySelector(".pm-main");
    const thumbs = pm.querySelector(".pm-thumbs");
    main.style.display = imgs.length ? "block" : "none";
    if(imgs.length){ main.src = imgs[0]; main.alt = m.name; }
    thumbs.innerHTML = "";
    if(imgs.length > 1) imgs.forEach((src,i)=>{
      const th = document.createElement("img");
      th.src = src; th.alt = m.name + " " + (i+1);
      if(i === 0) th.className = "on";
      th.onclick = ()=>{ main.src = src; thumbs.querySelectorAll("img").forEach(x=>x.classList.remove("on")); th.classList.add("on"); };
      thumbs.appendChild(th);
    });
    const det = escapeHtml(m.details || "").replace(/\s*\|\s*|\r?\n/g, "<br>");
    pm.querySelector(".pm-info").innerHTML =
      `<h3>${escapeHtml(m.name)}</h3>` +
      `<div class="specs mono">${escapeHtml(m.specs)}</div>` +
      (det ? `<div class="pm-details">${det}</div>` : "") +
      `<div class="pm-price">${escapeHtml(m.price)}</div>` +
      `<a class="pm-cta" href="${waLink(t.wa_inquiry(m.name))}" target="_blank" rel="noopener noreferrer">${t.detail_btn}</a>`;
    pm.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function renderFaq(){
    const t = i18n[currentLang];
    const list = document.getElementById("faq-list");
    list.innerHTML = "";
    for(let i=1;i<=5;i++){
      const item = document.createElement("div");
      item.className = "faq-item";
      item.innerHTML = `
        <button class="faq-q" aria-expanded="false">${t["faq"+i+"_q"]}<span class="plus">+</span></button>
        <div class="faq-a"><p>${t["faq"+i+"_a"]}</p></div>
      `;
      const btn = item.querySelector(".faq-q");
      const ans = item.querySelector(".faq-a");
      btn.onclick = ()=>{
        const isOpen = item.classList.contains("open");
        document.querySelectorAll(".faq-item").forEach(fi=>{fi.classList.remove("open"); fi.querySelector(".faq-a").style.maxHeight = null; fi.querySelector(".faq-q").setAttribute("aria-expanded","false");});
        if(!isOpen){ item.classList.add("open"); ans.style.maxHeight = ans.scrollHeight + "px"; btn.setAttribute("aria-expanded","true"); }
      };
      list.appendChild(item);
    }
  }

  function renderCases(){
    const t = i18n[currentLang];
    const list = document.getElementById("cases-list");
    if(!list) return;
    list.innerHTML = "";
    for(let i=1;i<=3;i++){
      const card = document.createElement("div");
      card.className = "case-card reveal";
      card.innerHTML = `
        <span class="case-tag">${t.cases_tag}</span>
        <div class="case-media">${t.cases_media_label}</div>
        <div class="case-body">
          <h4>${t["case"+i+"_title"]}</h4>
          <p>${t["case"+i+"_desc"]}</p>
        </div>
      `;
      list.appendChild(card);
    }
    observeReveals();
  }

  function animateCount(el, targetText){
    const match = targetText.match(/^(\d+)(.*)$/);
    if(!match){ el.textContent = targetText; return; }
    const target = parseInt(match[1], 10);
    const suffix = match[2] || "";
    const duration = 900;
    const start = performance.now();
    function tick(now){
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(target * eased);
      el.textContent = current + suffix;
      if(progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function observeStatCounters(){
    const stats = document.querySelectorAll(".stat-num[data-count]");
    if(!stats.length) return;
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          animateCount(e.target, e.target.getAttribute("data-count"));
          io.unobserve(e.target);
        }
      });
    }, {threshold:0.4});
    stats.forEach(el=>io.observe(el));
  }

  function setLang(lang){
    currentLang = lang;
    applyStaticText();
    renderFilters();
    renderCards();
    renderFaq();
    renderCases();
  }

  document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> setLang(btn.dataset.lang));
  });

  function observeReveals(){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in-view"); io.unobserve(e.target); } });
    }, {threshold:0.15});
    document.querySelectorAll(".reveal:not(.in-view)").forEach(el=>io.observe(el));
  }

  // Mobil menü
  const menuBtn = document.querySelector(".menu-toggle"), siteHeader = document.querySelector("header");
  function closeMenu(){ siteHeader.classList.remove("nav-open"); menuBtn.textContent = "☰"; menuBtn.setAttribute("aria-expanded","false"); }
  menuBtn.setAttribute("aria-expanded","false");
  menuBtn.addEventListener("click", ()=>{ const o = siteHeader.classList.toggle("nav-open"); menuBtn.textContent = o ? "✕" : "☰"; menuBtn.setAttribute("aria-expanded", String(o)); });
  document.querySelectorAll("nav.links a").forEach(a=>a.addEventListener("click", closeMenu));

  // Google Maps erst nach Klick laden (Zwei-Klick-Lösung, DSGVO)
  document.getElementById("map-load").addEventListener("click", ()=>{
    const f = document.createElement("iframe");
    f.id = "map-frame"; f.title = "GroundEx GmbH – Google Maps"; f.loading = "lazy";
    f.referrerPolicy = "no-referrer-when-downgrade"; f.allowFullscreen = true;
    f.style.cssText = "width:100%;height:340px;border:0;";
    f.src = "https://www.google.com/maps?q=" + encodeURIComponent(COMPANY_ADDRESS) + "&output=embed";
    document.getElementById("map-wrap").replaceChildren(f);
  });

  setLang("de");
  observeReveals();
  observeStatCounters();

  // TOZ / DUMAN BULUTLARI — sürekli süzülen arka plan tozu
  function spawnDustField(){
    const field = document.getElementById("dust-field");
    if(!field) return;
    const count = 10;
    for(let i=0;i<count;i++){
      const mote = document.createElement("div");
      mote.className = "dust-mote";
      const size = 30 + Math.random()*90;
      const left = Math.random()*100;
      const top = 20 + Math.random()*70;
      const dx = (Math.random()*80 - 20).toFixed(0) + "px";
      const dy = (-(60 + Math.random()*100)).toFixed(0) + "px";
      const duration = 9 + Math.random()*10;
      const delay = Math.random()*duration;
      mote.style.width = size + "px";
      mote.style.height = size + "px";
      mote.style.left = left + "%";
      mote.style.top = top + "%";
      mote.style.setProperty("--dx", dx);
      mote.style.setProperty("--dy", dy);
      mote.style.animationDuration = duration + "s";
      mote.style.animationDelay = "-" + delay + "s";
      field.appendChild(mote);
    }
  }
  spawnDustField();

  // SİNEMATİK ARKA PLAN FOTOĞRAFI — mevcut ürün fotoğraflarından biri, ayrıca gömülmüyor (dosya şişmesin diye)
  const heroBg = document.getElementById("hero-bg");
  if(heroBg && machines[0] && machines[0].image){
    heroBg.style.backgroundImage = `url(${machines[0].image})`;
  }

  // SİNEMATİK PARALAKS — hero içeriği scroll ile hafifçe, yumuşak şekilde hareket eder (derinlik hissi)
  let targetY = 0, currentY = 0;
  function updateParallax(){
    const heroInner = document.querySelector(".hero-inner");
    const stats = document.querySelector(".stats-strip");
    if(!heroInner) return;
    targetY = window.scrollY;
    currentY += (targetY - currentY) * 0.08; // yumuşak takip (lerp)
    const offset = Math.min(currentY * 0.25, 80);
    heroInner.style.transform = `translateY(${offset}px)`;
    if(stats){
      stats.style.transform = `translateY(${offset*0.5}px)`;
    }
    requestAnimationFrame(updateParallax);
  }
  requestAnimationFrame(updateParallax);
</script>
  <script>
/* GroundEx – Ürünleri Google Sheet'ten yükler.
   Sheet erişilemezse sitedeki mevcut (elle yazılmış) ürünler görünmeye devam eder. */
(function(){
  // >>> Google Sheets'ten aldığın "CSV olarak yayınla" linkini buraya yapıştır <<<
  var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCfV305APLIKOAu7lL2yiOJRP76kStQz7h1iUyOe-lmrwwmRx7zpZEFn6dCW7iQ_v0MQujK2ZBArpG/pub?output=csv";

  if(!/^https:\/\/docs\.google\.com\//.test(SHEET_CSV_URL)) return;

  function parseCSV(t){
    var rows = [], row = [], f = "", q = false;
    function push(){ row.push(f); f = ""; }
    function endRow(){ push(); if(row.some(function(x){ return x.trim() !== ""; })) rows.push(row); row = []; }
    for(var i = 0; i < t.length; i++){
      var c = t[i];
      if(q){
        if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; }
        else f += c;
      } else if(c === '"') q = true;
      else if(c === ',') push();
      else if(c === '\n' || c === '\r'){ if(c === '\r' && t[i+1] === '\n') i++; endRow(); }
      else f += c;
    }
    endRow();
    return rows;
  }

  var yes = /^(ja|evet|yes|1|x|true|wahr)$/i, no = /^(nein|hayir|hayır|no|0|false|falsch)$/i;
  var CATS = ["baumaschinen","fahrzeuge","werkzeuge","pflege"], TYPES = ["kauf","miete","kauf_miete"];

  function cleanImage(v){
    v = (v || "").trim();
    if(!v) return "";
    if(/^https:\/\/[^\s"'<>]+$/.test(v)) return v;          // tam link
    if(/^[\w\-. ]+\.(jpe?g|png|webp)$/i.test(v)) return "images/" + v; // sadece dosya adı
    return "";
  }

  // "a.jpg, b.jpg, c.jpg" -> ["images/a.jpg", "images/b.jpg", ...]
  function cleanImages(v){
    return (v || "").split(/[,;\n]+/).map(cleanImage).filter(Boolean);
  }

  fetch(SHEET_CSV_URL + (SHEET_CSV_URL.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(text){
      var rows = parseCSV(text);
      if(rows.length < 2) return;
      var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
      function col(r, name){ var i = head.indexOf(name); return i < 0 ? "" : (r[i] || "").trim(); }

      var items = [];
      rows.slice(1).forEach(function(r){
        var name = col(r, "name");
        if(!name || no.test(col(r, "aktiv"))) return;
        var cat = col(r, "kategorie").toLowerCase(), typ = col(r, "typ").toLowerCase();
        if(cat === "nutzfahrzeuge" || cat === "nutzfahrzeug" || cat === "arac" || cat === "araç") cat = "fahrzeuge";
        items.push({
          name: name,
          category: CATS.indexOf(cat) >= 0 ? cat : "pflege",
          type: TYPES.indexOf(typ) >= 0 ? typ : "kauf",
          price: col(r, "preis") || "Preis auf Anfrage",
          specs: col(r, "beschreibung"),
          image: cleanImages(col(r, "foto"))[0] || "",
          images: cleanImages(col(r, "foto")),
          details: col(r, "details") || col(r, "detail"),
          used: yes.test(col(r, "gebraucht"))
        });
      });
      if(!items.length) return;

      machines.splice.apply(machines, [0, machines.length].concat(items));
      activeCategory = "all";
      renderFilters();
      renderCards();
      var bg = document.getElementById("hero-bg");
      if(bg && items[0].image) bg.style.backgroundImage = "url(" + items[0].image + ")";
    })
    .catch(function(e){ console.warn("GroundEx: Sheet yüklenemedi, yedek liste kullanılıyor.", e); });
})();

</script>
